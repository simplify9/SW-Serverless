name: Node SDK

on:
  push:
    branches: [main]
    paths: ["sdk/node/**", ".github/workflows/node-sdk.yml"]
  pull_request:
    paths: ["sdk/node/**", ".github/workflows/node-sdk.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        working-directory: sdk/node
        run: node --test
