name: Build and Publish NuGet Package

on:
  push:
    branches: [main]
  workflow_dispatch:

# No token scopes by default. The Publish job grants the ceiling the reusable
# workflow's jobs run under; each of its jobs narrows it further.
permissions: {}

jobs:
  Publish:
    permissions:
      contents: write         # tag job: create the git tag
      packages: write         # nuget job: only used when pushing to a GitHub Packages feed
      security-events: read   # critical-vuln gate job
    uses: simplify9/.github/.github/workflows/reusable-nuget-publish.yml@0f33f79176152bc11acf0ff08ed970ae8b429b3d # main
    with:
      # Contract FIRST: both of the others depend on it, and publishing them without it
      # produces packages whose dependency cannot resolve — which is what 8.1.13 shipped as.
      nuget-projects: >-
        SW.Serverless.Contract/SW.Serverless.Contract.csproj
        SW.Serverless/SW.Serverless.csproj
        SW.Serverless.Sdk/SW.Serverless.Sdk.csproj
      major-version: '10'
      minor-version: '0'
      dotnet-version: '10.0.x'
      run-tests: true
      test-projects: '**/*UnitTests/*.csproj'
    secrets:
      nuget-api-key: ${{ secrets.SWNUGETKEY }}
      dependabot-alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
