name: SDK release

# Publishes the Python SDK to PyPI as sw-serverless and the Node SDK to npm as
# @simplyworks/sw-serverless. Never run by hand or by a tag: nuget-publish.yml calls it with the
# version it computed, so the SDKs carry the version of the packages they ship with. Only a release
# version is published; a prerelease (a branch build) isn't, since PyPI and npm consumers on a plain
# version range would pick it up. Each is tested first, and a version already on its registry is
# left alone, so a failed run can simply be run again.
on:
  workflow_call:
    inputs:
      version:
        description: "The version the calling run computed"
        type: string
        required: true

permissions:
  contents: read

jobs:
  python:
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="$VERSION"
          sed -i -E "s/^version = \".*\"/version = \"$v\"/" pyproject.toml
          sed -i -E "s/^SDK_VERSION = \".*\"/SDK_VERSION = \"$v\"/" src/sw_serverless/_runner.py
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  node:
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="$VERSION"
          npm version "$v" --no-git-tag-version --allow-same-version
          sed -i -E "s/^const SDK_VERSION = \".*\";/const SDK_VERSION = \"$v\";/" src/index.js
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: node --test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "$name@${{ steps.version.outputs.value }} is already on npm."
          else
            npm publish --access public
          fi
